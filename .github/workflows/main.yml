name: DumboMax APK Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Find Flutter Android app
        shell: bash
        run: |
          # Allow manual override if PROJECT_DIR is already set (e.g., via env or workflow input)
          if [ -n "$PROJECT_DIR" ]; then
            echo "Using provided PROJECT_DIR=$PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          PROJECT_DIR=""
          PROJECT_DIR_FALLBACK=""
          while IFS= read -r -d '' f; do
            dir=$(dirname "$f")
            # Prefer a project that contains android/app/build.gradle or build.gradle.kts
            if [ -f "$dir/android/app/build.gradle" ] || [ -f "$dir/android/app/build.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
            # Fallback: if android/app exists but gradle files are missing, remember it
            if [ -d "$dir/android/app" ] && [ -z "$PROJECT_DIR_FALLBACK" ]; then
              PROJECT_DIR_FALLBACK="$dir"
            fi
          done < <(find . -name pubspec.yaml -not -path '*/.dart_tool/*' -not -path '*/build/*' -print0)

          if [ -z "$PROJECT_DIR" ] && [ -n "$PROJECT_DIR_FALLBACK" ]; then
            echo "Warning: found android/app directory without build.gradle in: $PROJECT_DIR_FALLBACK"
            echo "Using it as PROJECT_DIR, but build may fail if Gradle files are missing."
            PROJECT_DIR="$PROJECT_DIR_FALLBACK"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Flutter Android app found."
            echo "Candidates (pubspec.yaml):"
            find . -name pubspec.yaml -not -path '*/.dart_tool/*' -not -path '*/build/*' -print
            exit 1
          fi

          echo "Found Flutter app in: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ env.PROJECT_DIR }}/android/app/upload-keystore.jks"

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build APK (Release Production)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Prepare Production APKs
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/release-apks"
          find "${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/" -name "*.apk" -exec cp {} "${GITHUB_WORKSPACE}/release-apks/" \;
          echo "Production APKs copied successfully"

      - name: Upload Production APKs
        uses: actions/upload-artifact@v4
        with:
          name: DumboMax-Production-APKs
          path: release-apks/*.apk
          if-no-files-found: error
